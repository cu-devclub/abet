apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # Logs and traces, read-only user abet_reader (created by es-init).
  - name: Elasticsearch logs
    uid: es-logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    basicAuth: true
    basicAuthUser: abet_reader
    editable: false
    jsonData:
      index: "filebeat-*"
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: log.level
    secureJsonData:
      basicAuthPassword: "$ES_READER_PASSWORD"
